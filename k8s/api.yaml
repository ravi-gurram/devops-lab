apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: app
  labels: { app: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: lab/api:0.1.0
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_HOST
              value: redis
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: app
spec:
  selector: { app: api }
  ports:
    - port: 80
      targetPort: 8000
