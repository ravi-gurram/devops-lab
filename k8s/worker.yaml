apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: app
  labels: { app: worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: lab/worker:0.1.1
          env:
            - name: REDIS_HOST
              value: redis
            - name: WORK_SECONDS
              value: "0.5"
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
